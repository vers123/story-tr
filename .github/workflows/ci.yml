name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest（26.04）已没有 3.9 的预装版本，固定到 22.04 继续覆盖
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
          - python-version: "3.14"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装（含 dev 与 mcp 依赖）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp]"

      - name: ruff
        run: ruff check .

      - name: pytest
        run: pytest -q

      - name: coverage（3.13）
        if: matrix.python-version == '3.13'
        run: pytest -q --cov=story_tr --cov-report=term-missing

  gui:
    # 只在最新的 Python 上跑 GUI：PySide6 体积大（约 200MB），无需铺满矩阵
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装（含 dev 与 gui 依赖）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui]"

      - name: 系统依赖（Qt 离屏运行所需）
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: pytest（Gui 测试离屏运行）
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  video:
    # 视频合成依赖 Pillow + 系统 ffmpeg + 中文字体；单独 job，避免给全矩阵装这些
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装（dev + video）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,video]"

      - name: 系统依赖（ffmpeg + 中文字体）
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: 字体冒烟
        run: python -c "from story_tr.video import find_fonts; print(find_fonts())"

      - name: pytest（video）
        run: pytest -q tests/test_video.py

  build:
    # 只验证打包与元数据，不发布
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装构建依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 构建并检查
        run: |
          python -m build
          twine check dist/*
