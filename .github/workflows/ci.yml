name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装（含 dev 与 mcp 依赖）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp]"

      - name: ruff
        run: ruff check .

      - name: pytest
        run: pytest -q

  gui:
    # 只在最新的 Python 上跑 GUI：PySide6 体积大（约 200MB），无需铺满矩阵
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装（含 dev 与 gui 依赖）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui]"

      - name: 系统依赖（Qt 离屏运行所需）
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: pytest（Gui 测试离屏运行）
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
