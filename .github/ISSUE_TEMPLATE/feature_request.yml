name: 功能建议
description: 提出新功能或改进想法
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请先搜索已有 issue，避免重复提交。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么场景下遇到了什么问题？目前是如何处理的？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你希望 story-tr 提供怎样的能力或输出？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其他做法或临时绕过方式
    validations:
      required: false
