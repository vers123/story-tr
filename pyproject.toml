[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "story-tr"
dynamic = ["version"]
description = "原神角色故事双语（中/英）文本抓取与「来回翻译 N 次」链路工具"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "vers123" }]
keywords = ["genshin", "translation", "dataset", "cli"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities",
]
dependencies = [
  "requests",
  "tqdm",
  "deep-translator",
  "langdetect",
  "python-dotenv",
  "gTTS",
  "tenacity",
]

[project.optional-dependencies]
dev = ["build", "twine", "ruff", "pytest", "pytest-cov"]
# MCP Server（只读）；官方 mcp SDK 需要 Python ≥3.10
mcp = ["mcp>=2.0,<3; python_version >= '3.10'"]
# PySide6 桌面界面
gui = ["PySide6>=6.5"]
# 视频合成（Pillow 负责逐帧排版；编码调用系统 ffmpeg）
video = ["Pillow>=9"]

[project.scripts]
story-tr = "story_tr.cli:main"
story-tr-mcp = "story_tr.mcp.server:main"
story-tr-gui = "story_tr.gui.app:main"

[project.urls]
Homepage = "https://github.com/vers123/story-tr"
Source = "https://github.com/vers123/story-tr"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "story_tr.__version__" }

[tool.ruff]
line-length = 110
target-version = "py39"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
