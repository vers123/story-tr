[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "story-tr"
dynamic = ["version"]
description = "原神角色故事双语（中/英）文本抓取与「来回翻译 N 次」链路工具"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "vers123" }]
keywords = ["genshin", "translation", "dataset", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities",
]
dependencies = [
  "typer",
  "httpx",
  "pydantic>=2",
  "pydantic-settings",
  "rich",
  "tenacity",
  "langdetect",
]

[project.optional-dependencies]
dev = ["mypy", "ruff", "pytest", "pytest-cov", "build", "twine"]

[project.scripts]
story-tr = "story_tr.cli:app"

[project.urls]
Homepage = "https://github.com/vers123/story-tr"
Source = "https://github.com/vers123/story-tr"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "story_tr.__version__" }

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["story_tr.core.*", "story_tr.models.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["story_tr"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
fail_under = 85
